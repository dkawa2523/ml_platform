repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-yaml
        exclude: ^(docs/ml_platform_mkdocs/mkdocs\.yml|deploy/)
      - id: end-of-file-fixer
        exclude: ^(docs/review/source/|verification/_historical/)
      - id: trailing-whitespace
        exclude: ^(docs/review/source/|verification/_historical/)
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff regression check
        entry: python -m quality precommit-ruff
        language: system
        types_or: [python, pyi]
      - id: ruff-format-check
        name: Ruff format check
        entry: python -m ruff format --check
        language: system
        types_or: [python, pyi]
      - id: pyrefly
        name: Pyrefly
        entry: pyrefly check
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: detect-secrets
        name: detect-secrets
        entry: detect-secrets-hook --baseline .secrets.baseline
        language: system
        exclude: ^\.secrets\.baseline$
      - id: gitlint
        name: gitlint
        entry: gitlint --msg-filename
        language: system
        stages: [commit-msg]
