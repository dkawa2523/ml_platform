[project]
name = "ml-platform-tabular"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "ml-platform-core",
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "pillow>=10.0",
]

[project.optional-dependencies]
lightgbm = ["lightgbm>=4.0"]
xgboost = ["xgboost>=2.0"]
catboost = ["catboost>=1.2"]
gbm = ["lightgbm>=4.0", "xgboost>=2.0", "catboost>=1.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
