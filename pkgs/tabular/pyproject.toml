[project]
name = "ml-platform-tabular"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "ml-platform-core",
  "pandas>=2.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
