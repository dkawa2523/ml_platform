[project]
name = "ml-platform-mvp"
version = "0.1.0"
description = "Minimal ML platform scaffold with ClearML boundary and tabular regression MVP."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
clearml = ["clearml>=1.14"]

[tool.pytest.ini_options]
pythonpath = [
  "pkgs/core/src",
  "pkgs/tabular/src",
  "."
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
  "docs/ml_platform_mkdocs/site",
  "outputs",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.importlinter]
root_packages = [
  "ml_platform_core",
  "ml_platform_tabular",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core and tabular stay free of ClearML runtime imports"
type = "forbidden"
source_modules = [
  "ml_platform_core",
  "ml_platform_tabular",
]
forbidden_modules = [
  "clearml",
]
