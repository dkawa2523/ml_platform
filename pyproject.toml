[project]
name = "ml-platform-mvp"
version = "0.1.0"
description = "Minimal ML platform scaffold with ClearML boundary and tabular regression MVP."
requires-python = ">=3.10"
dependencies = [
  "ml-platform-core",
  "ml-platform-tabular",
]

[project.optional-dependencies]
clearml = ["clearml==2.1.7"]
gbm = ["ml-platform-tabular[gbm]"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "pre-commit>=4.0",
  # gitlint remains in requirements-dev.txt for compatibility. gitlint 0.19.x
  # pins sh==1.14.3, whose build metadata imports fcntl on Windows under uv.
  "radon>=6.0",
  "import-linter>=2.0",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "pymdown-extensions>=10.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "pkgs/core",
  "pkgs/tabular",
]

[tool.uv.sources]
ml-platform-core = { workspace = true }
ml-platform-tabular = { workspace = true }

[tool.pytest.ini_options]
pythonpath = [
  "pkgs/core/src",
  "pkgs/tabular/src",
  "."
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
  "docs/ml_platform_mkdocs/site",
  "outputs",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# ClearML templates execute these files directly, so they must bootstrap the
# operations directory before sibling imports until R18 moves runtime entrypoints
# behind a package/manifest boundary.
"clearml/app.py" = ["E402"]
"clearml/pipelines.py" = ["E402"]
"clearml/templates.py" = ["E402"]

[tool.importlinter]
root_packages = [
  "ml_platform_core",
  "ml_platform_tabular",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core and tabular stay free of ClearML runtime imports"
type = "forbidden"
source_modules = [
  "ml_platform_core",
  "ml_platform_tabular",
]
forbidden_modules = [
  "clearml",
]
