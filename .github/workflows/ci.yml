name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sync locked quality environment
        run: uv sync --frozen --all-extras --group quality
      - name: Run pull-request quality gate
        env:
          QUALITY_BASE_REF: origin/${{ github.base_ref || 'main' }}
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: uv run --group quality nox -s quality-pr
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: .quality/reports/
          if-no-files-found: warn
