name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package-ci:
    # TODO(R13): confirm whether arc-runner-set-spdml-ml-pipeline is available for this repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e pkgs/core -e pkgs/tabular -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall clearml pkgs scripts
      - name: Run tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest
      - name: Ruff check
        run: python -m ruff check .
      - name: Ruff format check
        run: python -m ruff format --check .
      - name: Radon complexity report
        run: python -m radon cc clearml pkgs scripts -s -a
      - name: Import boundary check
        run: lint-imports --config pyproject.toml
