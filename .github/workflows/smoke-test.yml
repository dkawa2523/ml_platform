name: smoke-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  local-product-smoke:
    # TODO(R13): confirm whether arc-runner-set-spdml-ml-pipeline is available for this repository.
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e pkgs/core -e pkgs/tabular -r requirements-dev.txt
      - name: Create sample data
        run: python scripts/make_sample_data.py
      - name: Run tabular pipeline smoke
        run: >-
          python scripts/local_run.py
          --task config/tasks/tabular_pipeline.yaml
          --profile config/profiles/local.yaml
          --set 'model.candidates=[linear,ridge,lasso,elasticnet,random_forest,extra_trees,gradient_boosting]'
      - name: Run tabular inference smoke
        run: python scripts/local_run.py --task config/tasks/tabular_infer.yaml --profile config/profiles/local.yaml
