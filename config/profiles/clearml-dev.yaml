profile: clearml-dev

runtime:
  output_dir: /mnt/clearml/outputs
  use_clearml: true

clearml:
  project_root: MLPlatform/Dev
  projects:
    templates: MLPlatform/Dev/Templates/Tabular
    pipelines: MLPlatform/Dev/Pipelines/Tabular
    preprocess: MLPlatform/Dev/Runs/Tabular/Preprocess
    train: MLPlatform/Dev/Runs/Tabular/Train
    ensemble: MLPlatform/Dev/Runs/Tabular/Ensemble
    evaluate: MLPlatform/Dev/Runs/Tabular/Evaluate
    infer: MLPlatform/Dev/Runs/Tabular/Infer
    # Backward-compatible fallback used by older ClearML SDK paths.
    stages: MLPlatform/Dev/Runs/Tabular/Stages
    tasks: MLPlatform/Dev/Runs/Tabular/Tasks
    experiments: MLPlatform/Dev/Experiments/Tabular
  queue: default
  execution:
    # Pullable execution image used by ClearML Agent for template runs.
    # Replace with the dev registry/image tag available to the target workers.
    image: registry.example.com/ml-platform/clearml-agent:dev
  dataset_project: datasets-dev
  # Dev template defaults for remote-safe Pipeline New Run.
  # ClearML Agent containers cannot see repo-local data/sample_train.csv unless mounted.
  default_dataset_id: b7afaea9d7aa42f084fb4fc06b0d4d41
  default_dataset_file: sample_train.csv
  # Set this when the ClearML server has no default artifact storage.
  artifact_output_uri: null
  repository: https://github.com/dkawa2523/ml_platform.git
  branch: main
  working_dir: .

logging:
  level: INFO
