profile: clearml-prod

runtime:
  output_dir: /mnt/clearml/outputs
  use_clearml: true

clearml:
  project_root: MLPlatform/Prod
  projects:
    templates: MLPlatform/Prod/Templates/Tabular
    pipelines: MLPlatform/Prod/Pipelines/Tabular
    preprocess: MLPlatform/Prod/Runs/Tabular/Preprocess
    train: MLPlatform/Prod/Runs/Tabular/Train
    ensemble: MLPlatform/Prod/Runs/Tabular/Ensemble
    evaluate: MLPlatform/Prod/Runs/Tabular/Evaluate
    infer: MLPlatform/Prod/Runs/Tabular/Infer
    # Backward-compatible fallback used by older ClearML SDK paths.
    stages: MLPlatform/Prod/Runs/Tabular/Stages
    tasks: MLPlatform/Prod/Runs/Tabular/Tasks
    experiments: MLPlatform/Prod/Experiments/Tabular
  queue: cpu
  execution:
    # Pullable execution image used by ClearML Agent for template runs.
    # Replace with the prod registry/image tag available to the target workers.
    image: registry.example.com/ml-platform/clearml-agent:prod
  dataset_project: datasets
  # Set this when the ClearML server has no default artifact storage.
  artifact_output_uri: null
  repository: https://github.com/dkawa2523/ml_platform.git
  branch: main
  working_dir: .

logging:
  level: INFO
