task: tabular_train_pipeline

# Deprecated duplicate config. The primary user-facing template
# tabular_train_pipeline_template now uses config/tasks/tabular_pipeline.yaml.
# Keep this file only as a temporary compatibility reference.

run:
  name: tabular_train_pipeline
  seed: 42

data:
  local_path: data/sample_train.csv
  clearml_dataset_id: null
  dataset_file: null
  target_column: target
  feature_columns: null
  id_columns: [id]

split:
  method: random
  valid_size: 0.2

metrics:
  names: [mae, rmse, r2]

features:
  preset: basic
  params: {}

model:
  params:
    ridge:
      alpha: 1.0
    random_forest:
      n_estimators: 20
      random_state: 42
      n_jobs: 1
    gradient_boosting:
      n_estimators: 20
      random_state: 42
  candidates:
    - linear
    - ridge
    - random_forest
    - gradient_boosting
  selection_metric: rmse
  ensemble:
    enabled: false
    method: mean_topk
    top_k: 3
