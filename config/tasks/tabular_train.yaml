task: tabular_train

# Compatibility-only local task.
# Primary product training uses config/tasks/tabular_pipeline.yaml:
# preprocess_features -> train_<model>* -> build_ensemble -> evaluate_models.
# This file is not a ClearML user-facing template sync target.

run:
  name: tabular_train
  seed: 42

data:
  local_path: data/sample_train.csv
  clearml_dataset_id: null
  dataset_file: null
  target_column: target
  feature_columns: null
  id_columns: [id]

split:
  method: random
  valid_size: 0.2

metrics:
  names: [mae, rmse, r2]

features:
  preset: basic
  params: {}

model:
  name: ridge
  params:
    alpha: 1.0
  candidates: []
  selection_metric: rmse
  search:
    enabled: false
    method: grid
    max_trials: 20
    search_space: {}
    retrain_best: true
  ensemble:
    enabled: false
    method: mean_topk
    top_k: 3
