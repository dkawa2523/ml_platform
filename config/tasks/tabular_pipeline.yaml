task: tabular_pipeline

run:
  name: tabular_training_pipeline
  seed: 42

# Official tabular training pipeline config.
# Default graph: preprocess_features -> train_<model>* -> build_ensemble -> evaluate_models.
# Inference remains a separate tabular_infer_template task.

data:
  local_path: data/sample_train.csv
  clearml_dataset_id: null
  dataset_file: null
  target_column: target
  feature_columns: null
  id_columns: [id]

split:
  method: random
  valid_size: 0.2

metrics:
  names: [mae, rmse, r2]

features:
  preset: basic
  params: {}

model:
  name: ridge
  params:
    ridge:
      alpha: 1.0
    random_forest:
      n_estimators: 20
      random_state: 42
      n_jobs: 1
    gradient_boosting:
      n_estimators: 20
      random_state: 42
  candidates:
    - linear
    - ridge
    - random_forest
    - gradient_boosting
  selection_metric: rmse
  ensemble:
    enabled: true
    method: mean_topk
    top_k: 3
