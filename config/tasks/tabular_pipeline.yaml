task: tabular_pipeline

run:
  name: tabular_training_pipeline
  seed: 42

# Official tabular training pipeline config.
# Default graph: preprocess_features -> train_<model>* -> build_ensemble_<method>* -> evaluate_models.
# Each ClearML ensemble node runs the internal build_ensemble stage with one method.
# Inference remains a separate tabular_infer_template task.
# Required local inputs: Input/local_path and Input/target_column.
# Required ClearML remote inputs: Input/clearml_dataset_id, Input/dataset_file,
# and Input/target_column. clearml-dev profile provides dev Dataset defaults.
# ClearML UI examples:
#   Basic/model_suite: default | fast | interpretable | tree | gbm | custom
#   Basic/quality_mode: fast | standard | quality
#     fast uses smaller tree/GBM estimator counts; standard matches this file;
#     quality modestly increases estimator counts without HPO.
#   Model/candidates in ClearML New Run is prefilled with all supported models.
#   GBDT is represented by the internal model name "gradient_boosting".
#   Model/model_params_by_name: prefilled with dependency-free and optional GBM model keys.
#     Explicit Model/model_params_by_name values take precedence over Basic/quality_mode.
#   Model/ensemble_methods: ["mean_topk","weighted","median"]
#   Features/drop_columns: ["unused_column"]
#   Features/passthrough_columns: ["already_numeric_feature"]
# Supported optional-dependency models lightgbm/xgboost/catboost require GBM
# packages in the ClearML execution venv. Synced templates add them for remote
# runs; remove GBM names from Model/candidates for slim/custom runs without them.

data:
  local_path: data/sample_train.csv
  clearml_dataset_id: null
  dataset_file: null
  target_column: target
  feature_columns: null
  id_columns: [id]

split:
  method: random
  valid_size: 0.2
  group_column: null
  time_column: null
  valid_filter_column: null
  valid_filter_value: null

metrics:
  names: [mae, rmse, r2]

features:
  preset: basic
  numeric_impute_strategy: median
  categorical_impute_strategy: missing_token
  categorical_encoder: onehot
  scaling: standard
  drop_columns: []
  passthrough_columns: []
  params: {}

model:
  name: ridge
  params:
    linear: {}
    ridge:
      alpha: 1.0
    random_forest:
      n_estimators: 20
      random_state: 42
      n_jobs: 1
    gradient_boosting:
      n_estimators: 20
      random_state: 42
    lasso:
      alpha: 0.01
      max_iter: 5000
    elasticnet:
      alpha: 0.01
      l1_ratio: 0.5
      max_iter: 5000
      random_state: 42
    extra_trees:
      n_estimators: 20
      random_state: 42
      n_jobs: 1
    lightgbm:
      n_estimators: 100
      random_state: 42
      n_jobs: 1
    xgboost:
      n_estimators: 100
      random_state: 42
      n_jobs: 1
      objective: reg:squarederror
      verbosity: 0
    catboost:
      iterations: 100
      random_seed: 42
      verbose: false
  candidates:
    - linear
    - ridge
    - lasso
    - elasticnet
    - random_forest
    - extra_trees
    - gradient_boosting
    - lightgbm
    - xgboost
    - catboost
  selection_metric: rmse
  ensemble:
    enabled: true
    methods:
      - mean_topk
      - weighted
      - median
    method: mean_topk
    top_k: 3

output:
  upload_plots: true
