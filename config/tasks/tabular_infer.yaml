task: tabular_infer

# User-facing inference task. Inference is intentionally separate from the
# training pipeline graph.

run:
  name: tabular_infer
  seed: 42

data:
  local_path: data/sample_infer.csv
  clearml_dataset_id: null
  target_column: null
  feature_columns: null
  id_columns: []

model:
  # ClearML UI recommended path:
  #   source_type: task_id
  #   source_task_id: <training pipeline controller or stage task id>
  #   model_selector: best | ensemble | model name
  # Local path:
  #   source_type: local_path
  #   local_model_path: <training pipeline run dir or model file>
  source_type: local_path
  source_task_id: null
  model_selector: best
  local_model_path: null

output:
  prediction_name: predictions.csv
  chunk_size: null
