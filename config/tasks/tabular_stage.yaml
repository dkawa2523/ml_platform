task: tabular_stage

# Internal PipelineController stage task. Do not clone this as a user-facing
# model-, ensemble-, or optimize-specific template. Run/stage selects the
# training or optimization stage behavior.

run:
  name: tabular_stage
  seed: 42
  stage: preprocess_features

data:
  local_path: data/sample_train.csv
  clearml_dataset_id: null
  dataset_file: null
  target_column: target
  feature_columns: null
  id_columns: [id]

split:
  method: random
  valid_size: 0.2

metrics:
  names: [mae, rmse, r2]

features:
  preset: basic
  params: {}

model:
  name: ridge
  params: {}
  candidates: []
  selection_metric: rmse
  search:
    enabled: false
    method: grid
    max_trials: 20
    search_space: {}
    retrain_best: true
  ensemble:
    enabled: false
    method: mean_topk
    top_k: 3

stage_inputs:
  preprocess_bundle: null
  feature_spec: null
  processed_train: null
  processed_valid: null
  model_refs: []
  ensemble_ref: null
  best_params: null
  optimization_summary: null
  model: null
  model_info: null
