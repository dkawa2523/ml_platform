task: tabular_stage

# Internal PipelineController stage task. Its parameter surface is intentionally
# broader than the user-facing pipeline template because steps receive artifact
# handoff values. Do not clone this as a user-facing model-, ensemble-, or
# optimize-specific template. Run/stage selects the stage behavior. Primary
# stages are preprocess_features, train_model, build_ensemble, and
# evaluate_models. Optimization/search stages are P2 future scope; see
# docs/ROADMAP.md.

run:
  name: tabular_stage
  seed: 42
  stage: preprocess_features

data:
  local_path: data/sample_train.csv
  clearml_dataset_id: null
  dataset_file: null
  source_manifest: null
  target_column: target
  feature_columns: null
  id_columns: [id]

split:
  method: random
  valid_size: 0.2
  group_column: null
  time_column: null
  valid_filter_column: null
  valid_filter_value: null

metrics:
  names: [mae, rmse, r2]

features:
  preset: basic
  numeric_impute_strategy: median
  categorical_impute_strategy: missing_token
  categorical_encoder: onehot
  scaling: standard
  drop_columns: []
  passthrough_columns: []
  params: {}

model:
  name: ridge
  params: {}
  candidates: []
  selection_metric: rmse
  ensemble:
    enabled: false
    methods:
      - mean_topk
    method: mean_topk
    top_k: 3

stage_inputs:
  preprocess_bundle: null
  processed_train: null
  processed_valid: null
  model_refs: []
  ensemble_refs: []

output:
  upload_plots: true
