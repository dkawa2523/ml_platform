task: tabular_stage

# Internal PipelineController stage task. Do not clone this as a user-facing
# model-, ensemble-, or optimize-specific template. Run/stage selects the
# stage behavior. Primary stages are preprocess_features, train_model,
# build_ensemble, and evaluate_models. Optimization stages are future.

run:
  name: tabular_stage
  seed: 42
  stage: preprocess_features

data:
  local_path: data/sample_train.csv
  clearml_dataset_id: null
  dataset_file: null
  target_column: target
  feature_columns: null
  id_columns: [id]

split:
  method: random
  valid_size: 0.2

metrics:
  names: [mae, rmse, r2]

features:
  preset: basic
  params: {}

model:
  name: ridge
  params: {}
  candidates: []
  selection_metric: rmse
  ensemble:
    enabled: false
    method: mean_topk
    top_k: 3

stage_inputs:
  preprocess_bundle: null
  feature_spec: null
  processed_train: null
  processed_valid: null
  model_refs: []
  ensemble_ref: null

output:
  report_plots: true
